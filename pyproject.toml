[project]
name = "model-training-starter"
version = "0.1.0"
description = "A small, inspectable Qwen3 fine-tuning starter with saved pause and resume."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "transformers==5.22.2",
  "peft==0.21.2",
  "accelerate==1.15.0",
  "datasets==5.2.0",
  "huggingface-hub==2.4.0",
  "safetensors==0.8.0",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0"]
cuda = ["torch==2.8.0", "bitsandbytes==0.50.2"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform != 'darwin' and platform_machine != 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
