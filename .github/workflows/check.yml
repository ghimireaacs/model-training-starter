name: Check starter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python bootstrap.py --backend cpu
      - run: python lab.py self-test
      - run: python bootstrap.py --backend cpu
      - run: python tools/package.py
